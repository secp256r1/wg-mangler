[workspace]
members = ["wg-mangler-ebpf"]
# Default: build only the main crate; the eBPF sub-crate is built separately
# for the bpfel target by aya-build.
default-members = ["."]

[package]
name = "wg-mangler"
version = "0.2.4"
edition = "2024"
description = "a program used to obfuscate WireGuard message headers"

[features]
default = []
kernel = ["dep:aya"]

[dependencies]
# compio replaces tokio as the async runtime. Default features provide the
# runtime + io-uring backend; on non-Linux the io-uring feature is a no-op
# and the polling (epoll/kqueue) backend is used instead. `polling` enables
# the fusion driver, which falls back to epoll when io_uring is unavailable
# (old kernels, restricted containers) instead of failing at startup.
compio = { version = "0.19", features = ["net", "time", "signal", "macros", "io", "sync", "polling"] }
# flume replaces tokio's mpsc/watch channels (compio itself depends on it).
flume = "0.11"
# future::select + pin_mut! replace the single tokio::select! usage.
futures-util = "0.3"
# FIONREAD ioctl for the non-blocking UDP drains (compio has no try_recv).
libc = "0.2"
clap = { version = "4.6.5", default-features = false, features = ["std", "derive", "help"] }
anyhow = "1.0.104"
log = "0.4.33"
bs58 = "0.5.1"
num_cpus = "1.17.0"
socket2 = "0.6.5"
env_logger = { version = "0.11.11", default-features = false }
getrandom = { version = "0.4.3", features = ["std"] }
sha2 = "0.11"
aya = { version = "0.14", optional = true }

[target.'cfg(windows)'.dependencies]
# ioctlsocket(FIONREAD) for the non-blocking UDP drains on Windows (libc
# does not expose winsock's ioctlsocket).
windows-sys = { version = "0.52", features = ["Win32_Networking_WinSock"] }

# aya-build + cargo_metadata live in the build-dependency graph only on
# Linux; build.rs decides at runtime whether `--features kernel` is enabled
# and no-ops otherwise, so the default build is unchanged. (Note: cargo does
# not support `feature = ...` inside [target.'cfg(..)'] tables, which is why
# the feature gate lives in build.rs, not here.)
[target.'cfg(target_os = "linux")'.build-dependencies]
aya-build = "0.2"
cargo_metadata = "0.23"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The eBPF crate is built by aya-build with its own RUSTFLAGS (--btf etc.);
# keep the aggressive strip/lto settings off it — stripped symbols or LTO
# interfere with the .BTF/license sections the kernel loader expects.
[profile.release.package.wg-mangler-ebpf]
strip = "none"
opt-level = 2
codegen-units = 16
